<!DOCTYPE html>
<html>
<head>

<title>Library</title>

<script>

function calculateFine(){

let days=
parseInt(document.getElementById("days").value);

let fine=0;

switch(true){

case(days<=5):
fine=days*2;
break;

case(days>5):
fine=days*5;
break;

}

document.getElementById("result").innerHTML=
"Fine Amount: ₹"+fine;

}

</script>

</head>

<body>

<h2>Library Books</h2>

<table border="1">

<tr>
<th>Book</th>
<th>Image</th>
</tr>

<tr>
<td>Java Programming</td>
<td>
<img src="book.jpg" width="100">
</td>
</tr>

</table>

<br>

Days Late:
<input type="number" id="days">

<button onclick="calculateFine()">
Calculate Fine
</button>

<p id="result"></p>

</body>
</html>
