<!DOCTYPE html>
<html>
<head>

<title>To Do List</title>

<script>

function addTask(){

let task=
document.getElementById("task").value;

let li=
document.createElement("li");

li.innerHTML=task;

document.getElementById("list")
.appendChild(li);

}

</script>

</head>

<body>

<h2>To Do List</h2>

<input type="text" id="task">

<button onclick="addTask()">
Add
</button>

<ul id="list"></ul>

</body>
</html>
