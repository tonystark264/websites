<!DOCTYPE html>
<html>
<head>

<title>Product Advertisement</title>

<script>

function showProduct(){

let product=
document.getElementById("product").value;

document.getElementById("demo").innerHTML=
"Selected Product: "+product;

}

</script>

</head>

<body>

<h2>Products</h2>

<table border="1">

<tr>
<th>Product</th>
<th>Price</th>
</tr>

<tr>
<td>Mobile</td>
<td>15000</td>
</tr>

</table>

<br>

<img src="mobile.jpg" width="150">

<br><br>

<select id="product"
onchange="showProduct()">

<option>Mobile</option>
<option>Laptop</option>
<option>Tablet</option>

</select>

<p id="demo"></p>

</body>
</html>
